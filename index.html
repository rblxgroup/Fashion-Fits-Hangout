<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fashion Fits Hangout</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background: linear-gradient(135deg, #1a120b, #3b2a1a);
    color:#fff;
    font-family:'Orbitron',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

/* CARD */
.card{
    width:100%;
    max-width:700px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.2);
    border-radius:25px;
    padding:40px;
    text-align:center;
    backdrop-filter:blur(12px);
    box-shadow:0 0 30px rgba(0,0,0,0.6);
}

/* VERIFIED BADGE */
.verified{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    font-weight:900;
    letter-spacing:2px;
    font-size:14px;
    margin-bottom:15px;
    color:#e6e6e6;
}

/* BLUE CHECK */
.check{
    width:18px;
    height:18px;
    background:#1DA1F2;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    color:white;
    font-weight:900;
    box-shadow:0 0 10px rgba(29,161,242,0.6);
}

/* TITLE */
.title{
    font-size:28px;
    font-weight:900;
    letter-spacing:2px;
    color:#f5f5f5;
}

.subtitle{
    font-size:12px;
    opacity:0.7;
    margin-top:5px;
    margin-bottom:25px;
}

/* LINE */
.line{
    width:120px;
    height:2px;
    background:#d2b48c;
    margin:20px auto;
    border-radius:5px;
}

/* BUTTONS */
.btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    text-decoration:none;
    color:#1a120b;
    background:#f5f5f5;
    padding:15px;
    margin:12px 0;
    border-radius:12px;
    font-weight:700;
    transition:0.3s;
    border:2px solid transparent;
}

.btn:hover{
    background:#3b2a1a;
    color:#fff;
    border:2px solid #d2b48c;
    transform:scale(1.05);
}

/* FOOTER */
.footer{
    margin-top:20px;
    font-size:11px;
    opacity:0.6;
}
</style>
</head>

<body>

<div class="card">

    <!-- VERIFIED -->
    <div class="verified">
        ROBLOX VERIFIED
        <div class="check">✓</div>
    </div>

    <!-- TITLE -->
    <div class="title">FASHION FITS HANGOUT</div>
    <div class="subtitle">free clothes • hangout games • hiring moderator</div>

    <div class="line"></div>

    <!-- DISCORD -->
    <a class="btn" href="https://discord.com/invite/1484260608013766779" target="_blank">
        💬 DISCORD SERVER
    </a>

    <!-- ROBLOX GROUP -->
    <a class="btn" href="https://roblox.com.ge/communities/4282935238/#!/about" target="_blank">
        🎮 ROBLOX GROUP
    </a>

    <div class="footer">
        © 2026 FASHION FITS HANGOUT
    </div>

</div>

</body>
</html>
